# Typecheck — added 2026-08-27
#
# This repo shipped with BOTH checks disabled in next.config.js
# (typescript.ignoreBuildErrors and eslint.ignoreDuringBuilds) and NO typecheck
# anywhere in CI. Nothing checked types before a deploy reached a live domain.
#
# Fifteen satellites were in that state. core compensates with a nightly
# workflow; these had nothing.
#
# WHY IT MATTERS HERE SPECIFICALLY: platform-sdk itself did not compile until
# 2026-08-27 — 24 type errors including an auth guard that was ALWAYS FALSE, so
# every app using the shared header rendered signed-out for a signed-in
# customer. That went unseen for months precisely because no consumer typechecked.
#
# COST CONTROLS, learned when the Actions budget froze twice in one day:
#   PR + manual only; a push trigger doubles every run
#   timeout-minutes is mandatory — seven untimed jobs once ran to the 360-minute
#     default, 42 hours from one stuck run
#   concurrency cancels superseded runs instead of multiplying them
#   npm ci with a cache, never bare npm install
name: Typecheck

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      # The PINNED binary. Bare `npx tsc` resolves TypeScript 6 rather than the
      # pinned v5 and fails on syntax these codebases rely on — that cost core
      # 38-54 minutes per CI run until it was found.
      - run: ./node_modules/.bin/tsc --noEmit
